name: Build & Release Android APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'public/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish APKs to a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Chand?! APKs (Universal, arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # A commit authored where the POSIX executable bit is not tracked (Windows, a web editor, an
      # archive upload) silently turns `./gradlew` into a 644 file, and every Gradle step then dies
      # with exit 126. Restore the bit instead of failing the whole release.
      - name: Make the Gradle wrapper and scripts executable
        run: chmod +x gradlew scripts/*.py scripts/*.sh 2>/dev/null || chmod +x gradlew
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Run unit & Robolectric tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-tests.log"

      # Raw job logs are not always retrievable through the API (the step log download fails with an
      # opaque EOF), so the failing test/compiler errors are surfaced as annotations. Same contract as
      # the CI workflow: keep these two steps in sync.
      - name: Summarise test failures as annotations
        if: steps.unit_tests.outcome == 'failure'
        run: |
          for x in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -f "$x" ] || continue
            awk '/<testcase / { if (match($0, /name="[^"]*"/)) n = substr($0, RSTART + 6, RLENGTH - 7) }
                 /<failure /  { if (match($0, /message="[^"]*"/)) {
                                  m = substr($0, RSTART + 9, RLENGTH - 10)
                                  gsub(/[\r\n]+/, " ", m)
                                  print n " :: " m } }' "$x"
          done | head -8 | cut -c1-1200 | sed 's/%/%25/g' | sed 's/^/::error::/'
          grep -E "^e: " "$RUNNER_TEMP/gradle-tests.log" | head -3 | sed 's/%/%25/g' | sed 's/^/::error::/'
          echo "::error::Unit & Robolectric tests failed (./gradlew :app:testDebugUnitTest)."
          exit 1

      - name: Upload test reports (failure only)
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when the tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Verify live-config signature
        run: |
          TRUSTED="$(grep -E '^liveConfigPublicKeys=' gradle/live-config-keys.properties | cut -d= -f2-)"
          if [ -z "$TRUSTED" ]; then
            echo "::warning::No live-config trust store configured; skipping signature verification."
            exit 0
          fi
          python3 scripts/verify-live-config.py --config chand-live-config.json --keys "$TRUSTED"

      - name: Prepare release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REF_INPUT: ${{ github.ref }}
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
          EFFECTIVE_KEY_PASSWORD="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
          MISSING_SECRETS=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_BASE64"
          [ -z "$SECRET_STORE_PASSWORD" ] && MISSING_SECRETS="$MISSING_SECRETS STORE_PASSWORD"

          if [ -z "$MISSING_SECRETS" ]; then
            python3 - "$KEYSTORE_FILE" << 'PYEOF'
          import base64, os, re, sys

          out_path = sys.argv[1]
          raw = os.environ.get("KEYSTORE_BASE64", "")
          # Strip PEM/certutil headers/footers if user encoded with certutil -encode
          lines = [ln for ln in raw.splitlines() if not ln.strip().startswith("-----")]
          cleaned = "".join(lines).lstrip("\ufeff").strip().strip("\"'")
          cleaned = re.sub(r"\s+", "", cleaned)
          cleaned = cleaned.replace("-", "+").replace("_", "/")
          if len(cleaned) % 4 != 0:
              cleaned += "=" * (4 - len(cleaned) % 4)

          if len(cleaned) < 200 or not re.fullmatch(r"[A-Za-z0-9+/=]+", cleaned):
              print(f"::error::KEYSTORE_BASE64 is not valid Base64 of a .jks keystore (cleaned length={len(cleaned)}). Re-encode my-upload-key.jks without quotes or extra text.", file=sys.stderr)
              sys.exit(1)

          try:
              decoded = base64.b64decode(cleaned, validate=True)
          except Exception as exc:
              print(f"::error::Failed to decode KEYSTORE_BASE64 ({type(exc).__name__}, length={len(cleaned)}).", file=sys.stderr)
              sys.exit(1)

          with open(out_path, "wb") as f:
              f.write(decoded)
          PYEOF
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Cannot open decoded keystore. Check that STORE_PASSWORD is correct and KEYSTORE_BASE64 is a valid .jks file."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              echo "::error::Key alias 'upload' was not found in the keystore. Re-create or rename your key alias to 'upload'."
              exit 1
            fi
            VERIFY_P12="/tmp/verify-key-$$.p12"
            rm -f "$VERIFY_P12"
            if ! keytool -importkeystore \
              -srckeystore "$KEYSTORE_FILE" \
              -srcstorepass "$SECRET_STORE_PASSWORD" \
              -srcalias upload \
              -srckeypass "$EFFECTIVE_KEY_PASSWORD" \
              -destkeystore "$VERIFY_P12" \
              -deststoretype PKCS12 \
              -deststorepass "verify-only-pass" \
              -noprompt >/dev/null 2>&1; then
              rm -f "$VERIFY_P12"
              echo "::error::STORE_PASSWORD is valid, but KEY_PASSWORD is incorrect for alias 'upload'. Check your KEY_PASSWORD secret."
              exit 1
            fi
            rm -f "$VERIFY_P12"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EFFECTIVE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_INPUT" == refs/tags/v* ]]; then
            echo "::error::Missing release signing secrets:$MISSING_SECRETS. Refusing to publish a tagged release with an ephemeral key."
            exit 1
          else
            echo "::warning::Missing release signing secrets:$MISSING_SECRETS. Building and publishing a test pre-release with an ephemeral key."
            EPHEMERAL_PASS="chand-ci-verify-only"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30 \
              -dname "CN=Chand CI Test,O=Chand,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            {
              echo "### Test Pre-Release (Ephemeral Signing)"
              echo "Missing Repository Secrets:$MISSING_SECRETS — so this build was published as a **Pre-release** for testing."
              echo "Add them under **Settings → Secrets and variables → Actions → Repository secrets** (key alias: \`upload\`) for signed, updatable Releases."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute automatic app version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '0' }}
        run: bash scripts/compute-version.sh

      - name: Build Universal, arm64-v8a, armeabi-v7a Release APKs & Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --stacktrace; then
            echo "::error::Debug APK build failed (./gradlew :app:assembleDebug). Expand this step log for details."
            exit 1
          fi
          if ! ./gradlew :app:assembleRelease -PenableAbiSplits=true --stacktrace; then
            echo "::error::Release APK build failed (./gradlew :app:assembleRelease -PenableAbiSplits=true). Expand this step log for details."
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Chand-debug.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist/Chand-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/Chand-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/Chand-armeabi-v7a-release.apk
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
            echo "HAS_R8_MAPPING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_R8_MAPPING=false" >> "$GITHUB_ENV"
          fi
          ls -lh dist/

      - name: Verify APK signatures and 4-byte alignment
        env:
          CERT_SHA256: ${{ vars.CERT_SHA256 }}
        run: |
          SDK_ROOT=""
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            if [ -n "$candidate" ] && [ -d "$candidate/build-tools" ]; then
              SDK_ROOT="$candidate"
              break
            fi
          done
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK build-tools directory not found."
            exit 1
          fi
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "::error::apksigner or zipalign not found in '$BUILD_TOOLS_DIR'."
            exit 1
          fi
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

          for apk in dist/*.apk; do
            echo "Checking zipalign (4-byte): $apk"
            if ! "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$apk" >/dev/null; then
              echo "::error::APK is not 4-byte aligned: $apk"
              exit 1
            fi
          done

          echo "Verifying debug APK signature: dist/Chand-debug.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs dist/Chand-debug.apk

          EXPECTED_SHA="$(printf '%s' "${CERT_SHA256:-}" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          WARNED_EMPTY_CERT="false"

          for apk in dist/Chand-*-release.apk; do
            echo "Verifying release APK signature: $apk"
            CERT_OUTPUT="$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$CERT_OUTPUT"
            RAW_SHA="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/^[[:space:]]*(V[0-9]+[[:space:]]+)?Signer([[:space:]]+#?[0-9]+|[[:space:]]*\([^)]*\))?:?[[:space:]]+certificate SHA-256 digest:[[:space:]]*//Ip' | head -n 1)"
            ACTUAL_SHA="$(printf '%s' "$RAW_SHA" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            if [ -z "$ACTUAL_SHA" ]; then
              echo "::error::Failed to extract signer SHA-256 digest from $apk"
              exit 1
            fi
            if [ "${RELEASE_SIGNING_READY:-false}" = "true" ]; then
              if [ -z "$EXPECTED_SHA" ]; then
                if [ "$WARNED_EMPTY_CERT" != "true" ]; then
                  echo "::warning::Repository variable CERT_SHA256 is empty; skipping signer fingerprint check (actual: $ACTUAL_SHA)."
                  WARNED_EMPTY_CERT="true"
                fi
              elif [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                echo "::error::Signer SHA-256 mismatch for $apk: expected '$EXPECTED_SHA', got '$ACTUAL_SHA'."
                exit 1
              fi
            fi
          done

      - name: Guard versionCode and signer continuity against latest release
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          RELEASES_JSON="$TMP_DIR/releases.json"

          if ! curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_SLUG/releases?per_page=20" \
            -o "$RELEASES_JSON"; then
            echo "::warning::Could not query GitHub releases for $REPO_SLUG; skipping versionCode guard."
            exit 0
          fi

          PREV_INFO="$(python3 - "$RELEASES_JSON" << 'PYEOF'
          import json, sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              releases = json.load(f)

          for rel in releases:
              if rel.get("draft") or rel.get("prerelease"):
                  continue
              apks = [a for a in rel.get("assets", []) if str(a.get("name", "")).lower().endswith(".apk")]
              if not apks:
                  continue
              universal = next((a for a in apks if "universal" in str(a.get("name", "")).lower()), apks[0])
              print(f"{rel.get('tag_name', '')}\t{universal.get('name', '')}\t{universal.get('browser_download_url', '')}")
              break
          PYEOF
          )"

          if [ -z "$PREV_INFO" ]; then
            echo "No previous published release APK found; skipping versionCode continuity guard."
            exit 0
          fi

          IFS=$'\t' read -r PREV_TAG PREV_ASSET_NAME PREV_ASSET_URL <<< "$PREV_INFO"
          echo "Comparing against previous published release: $PREV_TAG ($PREV_ASSET_NAME)"

          if ! gh release download "$PREV_TAG" -R "$REPO_SLUG" -p "$PREV_ASSET_NAME" --dir "$TMP_DIR" >/dev/null 2>&1; then
            curl -fsSL -L "$PREV_ASSET_URL" -o "$TMP_DIR/$PREV_ASSET_NAME"
          fi

          PREV_APK="$TMP_DIR/$PREV_ASSET_NAME"
          NEW_APK="dist/Chand-universal-release.apk"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          read_apk_meta() {
            local apk_path="$1"
            local badging cert_out pkg_vcode sha
            badging="$("$AAPT2" dump badging "$apk_path")"
            cert_out="$("$APKSIGNER" verify --print-certs "$apk_path")"
            pkg_vcode="$(printf '%s\n' "$badging" | python3 -c '
          import re, sys
          txt = sys.stdin.read()
          m = re.search(r"package:\s+name=\x27([^\x27]+)\x27.*?\bversionCode=\x27(\d+)\x27", txt)
          if not m:
              sys.exit(1)
          print(f"{m.group(1)}\t{m.group(2)}")
          ')"
            sha="$(printf '%s\n' "$cert_out" | sed -nE 's/^[[:space:]]*(V[0-9]+[[:space:]]+)?Signer([[:space:]]+#?[0-9]+|[[:space:]]*\([^)]*\))?:?[[:space:]]+certificate SHA-256 digest:[[:space:]]*//Ip' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            printf '%s\t%s\n' "$pkg_vcode" "$sha"
          }

          IFS=$'\t' read -r PREV_PKG PREV_VCODE PREV_SHA <<< "$(read_apk_meta "$PREV_APK")"
          IFS=$'\t' read -r NEW_PKG NEW_VCODE NEW_SHA <<< "$(read_apk_meta "$NEW_APK")"

          if [ -z "$PREV_PKG" ] || [ -z "$PREV_VCODE" ] || [ -z "$PREV_SHA" ]; then
            echo "::error::Could not extract package, versionCode, or signer SHA-256 from previous release APK '$PREV_APK'."
            exit 1
          fi
          if [ -z "$NEW_PKG" ] || [ -z "$NEW_VCODE" ] || [ -z "$NEW_SHA" ]; then
            echo "::error::Could not extract package, versionCode, or signer SHA-256 from current release APK '$NEW_APK'."
            exit 1
          fi

          echo "Previous: package=$PREV_PKG versionCode=$PREV_VCODE sha256=$PREV_SHA"
          echo "Current:  package=$NEW_PKG versionCode=$NEW_VCODE sha256=$NEW_SHA"

          if [ "$PREV_PKG" != "$NEW_PKG" ]; then
            echo "::error::Package ID mismatch against $PREV_TAG: previous='$PREV_PKG', current='$NEW_PKG'."
            exit 1
          fi
          if [ "$PREV_SHA" != "$NEW_SHA" ]; then
            echo "::error::Signer SHA-256 mismatch against $PREV_TAG: previous='$PREV_SHA', current='$NEW_SHA'."
            exit 1
          fi
          if ! (( 10#$NEW_VCODE > 10#$PREV_VCODE )); then
            echo "::error::New versionCode ($NEW_VCODE) must be strictly greater than $PREV_TAG versionCode ($PREV_VCODE). Increase repository variable VERSION_CODE_OFFSET."
            exit 1
          fi

      - name: Generate trusted update metadata (chand-update-metadata.json)
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          REPO_SLUG: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          BUILD_VERSION_NAME: ${{ env.VERSION_NAME }}
          BUILD_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          python3 - "$BUILD_TOOLS_DIR/aapt2" << 'PYEOF'
          import hashlib, json, os, re, subprocess, sys

          aapt2 = sys.argv[1]
          repo = os.environ["REPO_SLUG"]
          tag = os.environ["RELEASE_TAG"]
          ver_name = os.environ["BUILD_VERSION_NAME"]
          ver_code = int(os.environ["BUILD_VERSION_CODE"])
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          apk_names = [
              "Chand-arm64-v8a-release.apk",
              "Chand-armeabi-v7a-release.apk",
              "Chand-universal-release.apk",
          ]
          artifacts = []
          for name in apk_names:
              path = os.path.join("dist", name)
              badging = subprocess.check_output([aapt2, "dump", "badging", path], text=True)
              m = re.search(r"package:\s+name='([^']+)'.*?\bversionCode='(\d+)'", badging)
              if not m:
                  raise SystemExit(f"Failed to parse badging for {path}")
              pkg_name, apk_vcode = m.group(1), int(m.group(2))
              if pkg_name != "ir.thepoo7an.chand":
                  raise SystemExit(f"Unexpected package name {pkg_name} in {path}")
              if apk_vcode != ver_code:
                  raise SystemExit(f"APK versionCode {apk_vcode} != {ver_code} in {path}")

              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              artifacts.append({
                  "name": name,
                  "package_name": pkg_name,
                  "version_code": apk_vcode,
                  "version_name": ver_name,
                  "download_url": f"{base_url}/{name}",
                  "sha256": h.hexdigest(),
                  "size_bytes": os.path.getsize(path),
              })

          payload = {
              "schema_version": 1,
              "package_name": "ir.thepoo7an.chand",
              "version_code": ver_code,
              "version_name": ver_name,
              "artifacts": artifacts,
          }
          with open("dist/chand-update-metadata.json", "w", encoding="utf-8") as out:
              json.dump(payload, out, indent=2)
              out.write("\n")
          print("Generated dist/chand-update-metadata.json")
          PYEOF

      - name: Upload Release APKs artifact
        uses: actions/upload-artifact@v7
        with:
          name: chand-release-apks
          path: |
            dist/Chand-*-release.apk
            dist/chand-update-metadata.json
          retention-days: 30

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Chand-debug.apk
          path: dist/Chand-debug.apk
          retention-days: 30

      - name: Upload R8 mapping.txt (if generated)
        if: env.HAS_R8_MAPPING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chand-release-mapping
          path: dist/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate GitHub Release notes with commit range
        env:
          CURRENT_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          RELEASE_SIGNING_READY: ${{ env.RELEASE_SIGNING_READY }}
        run: |
          mkdir -p dist
          NOTES_FILE="dist/release-notes.md"
          {
            if [ "${RELEASE_SIGNING_READY:-false}" = "true" ]; then
              echo "### 📲 Download / دانلود فایل نصب"
              echo "- **Most modern Android phones (\`arm64-v8a\`):** \`Chand-arm64-v8a-release.apk\` *(Recommended / پیشنهادی)*"
              echo "- **Older 32-bit devices (\`armeabi-v7a\`):** \`Chand-armeabi-v7a-release.apk\`"
              echo "- **Universal (all CPUs):** \`Chand-universal-release.apk\`"
            else
              echo "⚠️ **Test Pre-Release (Ephemeral Signing):** Release signing secrets (\`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`) are not set in this repository yet. If you already have an older APK installed, uninstall it before installing this test build."
            fi
            echo ""
            PREV_TAG="$(git tag --sort=-v:refname | grep -v -F -x "$CURRENT_TAG" | head -n 1 || true)"
            if [ -n "$PREV_TAG" ]; then
              echo "### 📝 Changes since \`$PREV_TAG\`"
              COMMIT_LINES="$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD" | head -n 50 || true)"
            else
              echo "### 📝 Recent commits"
              COMMIT_LINES="$(git log --no-merges -n 20 --pretty=format:'- %s (%h)' || true)"
            fi
            if [ -n "${COMMIT_LINES:-}" ]; then
              printf '%s\n' "$COMMIT_LINES"
            else
              echo "- Initial automated build"
            fi
          } > "$NOTES_FILE"
          cat "$NOTES_FILE"

      - name: Publish all 3 APKs to GitHub Release (Signed)
        if: (github.event_name != 'workflow_dispatch' || inputs.publish == true) && env.RELEASE_SIGNING_READY == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Chand?! v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          prerelease: false
          body_path: dist/release-notes.md
          files: |
            dist/Chand-universal-release.apk
            dist/Chand-arm64-v8a-release.apk
            dist/Chand-armeabi-v7a-release.apk
            dist/chand-update-metadata.json
          generate_release_notes: true

      - name: Publish test pre-release APKs to GitHub Release (Ephemeral Signing)
        if: (github.event_name != 'workflow_dispatch' || inputs.publish == true) && env.RELEASE_SIGNING_READY != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Chand?! v${{ env.VERSION_NAME }} (Test Build ${{ env.VERSION_CODE }})
          prerelease: true
          body_path: dist/release-notes.md
          files: |
            dist/Chand-universal-release.apk
            dist/Chand-arm64-v8a-release.apk
            dist/Chand-armeabi-v7a-release.apk
          generate_release_notes: true
